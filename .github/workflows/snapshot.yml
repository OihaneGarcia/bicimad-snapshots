name: bicimad-snapshot

on:
  schedule:
    - cron: "39 * * * *"      # cada hora, en el minuto 39 (UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la web

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python snapshot_cloud.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git pull --rebase
          git push
